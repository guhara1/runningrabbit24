<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="에테르 파비콘">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a34"/>
      <stop offset="1" stop-color="#0e0a14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c98a"/>
      <stop offset="1" stop-color="#c79a4e"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="#d4af6a" stroke-opacity="0.65" stroke-width="1.5"/>
  <!-- 에테르(Aether) 모노그램 Æ -->
  <text x="32" y="33" fill="url(#gold)" font-family="'Noto Serif KR','Times New Roman',serif" font-size="38" font-weight="700" text-anchor="middle" dominant-baseline="central" letter-spacing="-1">Æ</text>
  <!-- 하단 악센트 라인 -->
  <rect x="20" y="49" width="24" height="2.2" rx="1.1" fill="url(#gold)" opacity="0.85"/>
</svg>
